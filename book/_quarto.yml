project:
    type: book
    output-dir: _book
    # pre-render: # make sure the pre-renders work if this is used
    #   get_acs_tables.R
    #   get_school_districts_saipe_data.R,
    #   get_census_population_estimates.R 
    #   get_ny_county_population_estimates.R

format:
  html:
    theme: cosmo
    code-fold: true
    number-depth: 5
    toc-depth: 5
    toc-expand: false
    grid:
      sidebar-width: 250px
      body-width: 800px
      margin-width: 300px

book:
  title: "Cambridge, New York"
  subtitle: "Demographics, economy, and housing"
  author: "Don Boyd"
  date: today
  date-format: long
  chapters:
    - index.qmd
    - part: "Demographics"
      chapters:    
        - demographics_poptrends.qmd
        - demographics_age.qmd
        - demographics_education.qmd
    - part: "Economy"
      chapters: 
        - economy_income.qmd
        - economy_poverty.qmd
        - economy_migration.qmd
    - part: "Housing"
      chapters: 
        - housing_ownership.qmd
        - housing_rental_costs.qmd
    - part: "Health"
      chapters: 
        - health.qmd
    - part: "Outlook and implications"
      chapters: 
        - outlook.qmd
        - implications.qmd
    - part: "Appendices"
      chapters: 
        - todos.qmd
  
execute:
  eval: true
  echo: false
  output: false
  freeze: auto  # auto: during global project renders, re-render only when source changes
    
editor:
  console: true
  markdown:
    wrap: 72
    canonical: true
    
editor_options:
  chunk_output_type: console
    
